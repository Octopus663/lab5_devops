name: DevOps Lab Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  workflow_dispatch: # Дозволяє запускати вручну кнопкою

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: ./mvnw clean package

  docker-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Тег залежить від гілки: myapp:main або myapp:dev
          tags: ${{ secrets.DOCKER_USERNAME }}/lab5-app:${{ github.ref_name }}

  deploy:
    needs: docker-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ github.ref_name == 'main' && secrets.PROD_HOST || secrets.DEV_HOST }}
          username: ${{ github.ref_name == 'main' && secrets.PROD_USERNAME || secrets.DEV_USERNAME }}
          key: ${{ github.ref_name == 'main' && secrets.PROD_SSH_KEY || secrets.DEV_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/lab5-app:${{ github.ref_name }}
            docker stop app-${{ github.ref_name }} || true
            docker rm app-${{ github.ref_name }} || true
            docker run -d \
              --name app-${{ github.ref_name }} \
              -p ${{ github.ref_name == 'main' && '80:8080' || '8080:8080' }} \
              ${{ secrets.DOCKER_USERNAME }}/lab5-app:${{ github.ref_name }}